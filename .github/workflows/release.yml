name: Release

on:
  # A version bump landing on main *is* the release: this workflow builds it,
  # tags it, publishes the GitHub release and then npm. The tag is the record
  # of what shipped, not the trigger — a tag pushed with GITHUB_TOKEN starts no
  # workflow, so hanging the release off one would tag and publish nothing.
  # A tag pushed by hand still works: it re-releases that exact commit.
  push:
    branches: [main]
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a version bump lands.
  workflow_dispatch:

permissions:
  contents: write

# Two version bumps in a row must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What is this run — a release, a dry run, or nothing at all?
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            sed -n 's/.*"name":"pacer","version":"\([^"]*\)".*/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              # A tag that disagrees with the workspace version ships a binary
              # whose `--version` lies. Cheaper to fail here than to yank a
              # release.
              tag="${GITHUB_REF_NAME#v}"
              [ "$version" = "$tag" ] ||
                { echo "tag $GITHUB_REF_NAME != workspace version $version"; exit 1; }
              build=true; release=true ;;
            refs/heads/main)
              # Most pushes to main are not releases. A version nobody has
              # tagged yet is.
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "v$version is already released - nothing to do"
                build=false; release=false
              else
                echo "v$version is new - releasing"
                build=true; release=true
              fi ;;
            *)
              build=true; release=false ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Two artifacts per target from one build: the archive `install.sh`
      # downloads, and the bare binary the npm packages wrap. Artifact
      # download drops the executable bit — the npm build script re-chmods.
      - name: Package (unix)
        if: matrix.runner != 'windows-latest'
        run: tar -czf pacer-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release pacer

      - name: Package (windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/pacer.exe -DestinationPath pacer-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: pacer-${{ matrix.target }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/pacer${{ matrix.runner == 'windows-latest' && '.exe' || '' }}

  release:
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true

      # Only when the run came from main — a tag push already has one.
      - name: Tag this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v${{ needs.gate.outputs.version }}" \
            -f sha="$GITHUB_SHA"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          files: |
            pacer-*.tar.gz
            pacer-*.zip
          generate_release_notes: true

  # npm carries the binaries itself, so it is the install route that works
  # everywhere. Same binaries the release job just attached, never a rebuild.
  npm:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/npm.yml
    with:
      tag: v${{ needs.gate.outputs.version }}
      scope: "@petukhovart"
      dry_run: false
    secrets: inherit
