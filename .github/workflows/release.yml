name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a tag is cut (the release job below
  # only runs for a tag push).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the workspace version ships a binary whose
      # `--version` lies. Cheaper to fail here than to yank a release.
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 |
            sed -n 's/.*"name":"pacer","version":"\([^"]*\)".*/\1/p')
          tag="${GITHUB_REF_NAME#v}"
          [ "$crate" = "$tag" ] ||
            { echo "tag $GITHUB_REF_NAME != workspace version $crate"; exit 1; }

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Two artifacts per target from one build: the archive `install.sh`
      # downloads, and the bare binary the npm packages wrap. Artifact
      # download drops the executable bit — the npm build script re-chmods.
      - name: Package (unix)
        if: matrix.runner != 'windows-latest'
        run: tar -czf pacer-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release pacer

      - name: Package (windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/pacer.exe -DestinationPath pacer-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: pacer-${{ matrix.target }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/pacer${{ matrix.runner == 'windows-latest' && '.exe' || '' }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            pacer-*.tar.gz
            pacer-*.zip
          generate_release_notes: true
