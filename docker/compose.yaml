x-usage: |
  Berth in Docker: berth-server (the desktop app's core without a window), the berth daemon, Claude Code CLI, git and gh in one container.
  1. On the remote PC, from the repository root:
       docker compose -f docker/compose.yaml up -d --build
     Repositories live in ./workspace next to this file (BERTH_WORKSPACE=/path overrides).
  2. Pairing link and QR code:
       docker compose -f docker/compose.yaml logs berth
     Set BERTH_PUBLIC_URL=http://<pc address>:4477 so the link and QR carry the address the phone can reach.
  3. Claude login, once, kept in the claude volume:
       docker compose -f docker/compose.yaml exec -it berth claude
     then /login, or put ANTHROPIC_API_KEY into the environment before step 1.
  4. GitHub and GitLab CLIs, once:
       docker compose -f docker/compose.yaml exec -it berth gh auth login
       docker compose -f docker/compose.yaml exec -it berth glab auth login   (image built with GLAB_VERSION)
  5. Git identity and repositories:
       docker compose -f docker/compose.yaml exec berth git config --global user.name "..."
       docker compose -f docker/compose.yaml exec berth git clone <url> /workspace/<name>
       docker compose -f docker/compose.yaml exec berth berth add /workspace/<name>
     SSH keys go into the ssh volume (/root/.ssh).
  The token is in the home volume, secrets.json; delete its remote-pairing-token entry and restart to rotate it.
  Expose the port only on a trusted network or a tailnet: BERTH_HOST_BIND=100.x.y.z keeps it off other interfaces.

name: berth

services:
  berth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GLAB_VERSION: ${GLAB_VERSION:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    image: berth:local
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${BERTH_HOST_BIND:-0.0.0.0}:${BERTH_HOST_PORT:-4477}:4477"
    environment:
      - BERTH_PUBLIC_URL
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_AUTH_TOKEN
      - GH_TOKEN
      - GITLAB_TOKEN
      - TZ
    volumes:
      - ${BERTH_WORKSPACE:-./workspace}:/workspace
      - home:/root/.berth
      - claude:/root/.claude
      - daemon:/root/.local/share/berth
      - gh:/root/.config/gh
      - glab:/root/.config/glab-cli
      - git:/root/.config/git
      - ssh:/root/.ssh
    tmpfs:
      - /run/berth:mode=0700

volumes:
  home:
  claude:
  daemon:
  gh:
  glab:
  git:
  ssh:
