[package]
name = "veyra-desktop"
version = "0.0.0"
edition = "2021"

[lib]
name = "veyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
pacer-core = { git = "https://github.com/PetukhovArt/pacer", tag = "v0.19.0" }
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
