[package]
name = "nebula-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
ulid = { workspace = true }
directories = { workspace = true }
rmp-serde = { workspace = true }
tokio = { version = "1", features = ["io-util", "net", "time"] }

# Windows has no AF_UNIX socket for the DAEMON SOCKET, so `transport` falls
# back to loopback TCP with a bearer token; these two are what mint and
# compare it. Unix keeps the crate dep-light.
[target.'cfg(windows)'.dependencies]
rand = "0.10"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "macros", "net", "time"] }
