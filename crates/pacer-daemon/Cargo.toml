[package]
name = "pacer-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pacer-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
axum = "0.8"
tokio-util = "0.7"
rand = "0.10"
subtle = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "fs", "signal", "term"] }

# Job Objects (`pty::kill`) and DETACHED_PROCESS: the struct layout of
# JOBOBJECT_EXTENDED_LIMIT_INFORMATION is not worth hand-declaring, and this
# crate is already in the tree under tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
# The machine-wide process table `metrics` sums over; `ps` on Unix.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
# The ConPTY unicode probe rebuilds a captured stream in the same grid the
# TUI renders from, so it has to be the same vendored vt100.
vt100 = "0.16"
